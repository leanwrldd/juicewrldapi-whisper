<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DB Manager — WRLD Sync</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131c;
    --surface2: #1c1c2a;
    --border: #2a2a3d;
    --accent: #7c3aed;
    --accent2: #a855f7;
    --text: #f0f0ff;
    --muted: #7878a0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
  }
  .logo {
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    white-space: nowrap;
  }
  .page-title {
    font-size: .9rem;
    font-weight: 600;
    color: var(--muted);
  }
  .back-btn {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 13px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    font-size: .82rem;
    font-weight: 600;
    text-decoration: none;
    transition: color .15s, border-color .15s, background .15s;
  }
  .back-btn:hover { color: var(--text); border-color: var(--accent2); background: rgba(124,58,237,.08); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 28px;
  }
  .tools-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
    max-width: 900px;
    margin: 0 auto;
  }
  .tool-card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    text-decoration: none;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .tool-card:hover { border-color: var(--accent2); background: var(--surface2); transform: translateY(-1px); }
  .tool-card svg { color: var(--accent2); }
  .tool-name { font-size: .92rem; font-weight: 700; }
  .tool-desc { font-size: .78rem; color: var(--muted); line-height: 1.4; }
</style>
</head>
<body>

<header>
  <div class="logo">WRLD Sync</div>
  <span class="page-title">Database Manager</span>
  <a class="back-btn" href="/">
    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Back
  </a>
</header>

<main>
  <div class="tools-grid">
    <a class="tool-card" href="/autogroup.html">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span class="tool-name">Autogroup</span>
      <span class="tool-desc">Group every song by title (version tags stripped), falling back to category when no version is present.</span>
    </a>
  </div>
</main>

</body>
</html>
